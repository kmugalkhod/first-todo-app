{id:6,s:'Completed',t:'Set up the shared content inventory',d:'',p:'P3',tag:'Planning',who:'Avery',av:'A',due:'Completed by Avery',late:false,subs:[],comments:[],done:true}
];
const st={v:'project',sel:window.innerWidth<621?null:1,compose:false,q:'',role:'Owner',completed:false,undo:null,timer:null};
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','>':'&gt;','<':'&lt;','"':'&quot;',"'":'&#039;'}[c]));
const one=id=>tasks.find(t=>t.id===Number(id));
const av=x=>'<span class="avatar taskavatar '+(x==='M'?'lime':x==='J'?'coral':'')+'" aria-hidden="true">'+x+'</span>';
function toast(text,undo){const el=document.querySelector('.toast');st.undo=undo||null;el.innerHTML='<span>'+esc(text)+'</span>'+(undo?'<button type="button" data-a="undo">Undo</button>':'');el.classList.add('show');clearTimeout(st.timer);st.timer=setTimeout(()=>{el.classList.remove('show');st.undo=null},5000)}
function row(t){const sub=t.subs.length?'<span class="submark">'+t.subs.filter(x=>x[1]).length+'/'+t.subs.length+'</span> subtasks':t.tag;return '<article class="task '+(st.sel===t.id?'selected':'')+'"><button class="check '+(t.done?'done':'')+'" type="button" data-a="complete" data-id="'+t.id+'" aria-label="'+(t.done?'Reopen':'Complete')+' '+esc(t.t)+'"></button><button class="taskcopy" type="button" data-a="select" data-id="'+t.id+'"><strong>'+esc(t.t)+'</strong><small>'+sub+'</small></button><span class="pill '+t.p.toLowerCase()+'">'+t.p+'</span><span class="pill tag">'+esc(t.tag)+'</span><span class="due '+(t.late?'overdue':'')+'">'+esc(t.due)+'</span>'+av(t.av)+'</article>'}
function section(name,list){return '<section class="section"><header class="sectionhead"><div><h2>'+esc(name)+'</h2><span>'+list.length+' '+(list.length===1?'task':'tasks')+'</span></div>'+(st.role==='Viewer'?'':'<button class="addline" type="button" data-a="composer">+ Add task</button>')+'</header>'+(list.length?list.map(row).join(''):'<div class="empty">No open work in this section.</div>')+'</section>'}
function composer(){return '<form class="composer" data-a="make-task" '+(st.compose?'':'hidden')+'><div class="composergrid"><input required name="title" maxlength="140" placeholder="What needs to get done?" aria-label="Task title"><select name="priority" aria-label="Priority"><option>P3</option><option>P1</option><option>P2</option><option>P4</option></select><select name="due" aria-label="Planned date"><option>Today</option><option>Tomorrow</option><option>Fri, Aug 7</option></select><button>Create task</button></div><p>This task will be added to Website relaunch · Launch plan. A planned date is not a deadline.</p></form>'}
function project(){let a=tasks.filter(t=>!t.done&&(!st.q||(t.t+' '+t.d+' '+t.tag).toLowerCase().includes(st.q.toLowerCase())));return '<section class="content"><header class="head"><div><h1>Website relaunch</h1><p>A shared home for the decisions and production work behind the next version of the studio site.</p></div><div class="actions"><button class="quiet" type="button" data-a="members">'+I.members+'<span>Members</span></button><button class="icon" type="button" aria-label="Project options">'+I.more+'</button></div></header><div class="meta"><div class="stack" aria-label="3 active members"><span class="avatar">A</span><span class="avatar lime">M</span><span class="avatar coral">J</span><span class="membercount">3 members</span></div><span>Owner: Avery Chen</span><span class="note"><i></i>Maya completed a task 18m ago</span></div>'+composer()+section('Launch plan',a.filter(t=>t.s==='Launch plan'))+section('Production',a.filter(t=>t.s==='Production'))+(st.completed?section('Completed',tasks.filter(t=>t.done)):'<button class="addline" style="margin-top:24px" type="button" data-a="show-completed">Show 1 completed task</button>')+'</section>'}
function plan(kind){const m={inbox:['Inbox','Capture it before it disappears. Decide its project when you are ready.',tasks.filter(t=>!t.done).slice(1,3)],today:['Today','Your scheduled work, including anything overdue.',tasks.filter(t=>!t.done&&(t.due.includes('Today')||t.late))],upcoming:['Upcoming','Future work, grouped by its planned date.',tasks.filter(t=>!t.done&&!t.due.includes('Today')&&!t.late)]};const x=m[kind];return '<section class="content"><header class="head"><div><h1>'+x[0]+'</h1><p>'+x[1]+'</p></div></header>'+composer()+section(kind==='upcoming'?'Tomorrow and later':'Ready to organise',x[2])+'</section>'}
function detail(){const t=one(st.sel);if(!t)return '<aside class="detail" hidden></aside>';const viewer=st.role==='Viewer';const sub=t.subs.length?'<section class="detailsection"><h3>Subtasks</h3><div class="subs">'+t.subs.map(x=>'<div class="sub '+(x[1]?'done':'')+'"><span class="mini"></span>'+esc(x[0])+'</div>').join('')+'</div>'+((t.done&&t.subs.some(x=>!x[1]))?'<div class="warning">This parent has unfinished child work. Reopen it to continue.</div>':'')+'</section>':'';const comments=t.comments.length?t.comments.map(x=>'<article class="comment">'+av(x[0].charAt(0))+'<div><div class="commentmeta"><strong>'+esc(x[0])+'</strong><time>'+esc(x[2])+'</time></div><p>'+esc(x[1])+'</p></div></article>').join(''):'<p class="desc">No comments yet. Keep progress in the task, where the whole project can find it.</p>';return '<aside class="detail" aria-label="Task details"><div class="detailtop"><span class="kicker">WEBSITE RELAUNCH / '+esc(t.s)+'</span><button class="close" type="button" data-a="close" aria-label="Close task details">'+I.close+'</button></div><h2>'+esc(t.t)+'</h2><p class="desc">'+esc(t.d||'No description yet. Add the context a collaborator needs before they begin.')+'</p><div class="properties"><div class="prop"><span>Assignee</span><div class="propvalue">'+av(t.av)+esc(t.who)+'</div></div><div class="prop"><span>Planned</span><div class="propvalue">'+I.calendar+esc(t.due)+'</div></div><div class="prop"><span>Priority</span><div class="propvalue"><span class="pill '+t.p.toLowerCase()+'">'+t.p+'</span></div></div><div class="prop"><span>Labels</span><div class="propvalue"><span class="pill tag">'+esc(t.tag)+'</span></div></div></div>'+sub+'<section class="detailsection"><h3>Comments</h3>'+comments+(viewer?'<p class="desc" style="margin-top:12px">Viewers can read comments and activity but cannot change this task.</p>':'<form class="commentform" data-a="comment"><textarea required name="comment" placeholder="Add a comment" aria-label="Add a comment"></textarea><button>Add</button></form>')+'</section><section class="detailsection"><h3>Activity</h3><div class="activity"><div class="activityrow"><i></i><span><strong>Maya</strong> updated the planned date <time>Today, 10:14 AM</time></span></div><div class="activityrow"><i></i><span><strong>Avery</strong> assigned this to Maya <time>Yesterday, 4:22 PM</time></span></div><div class="activityrow"><i></i><span><strong>Avery</strong> created this task <time>Yesterday, 4:11 PM</time></span></div></div></section>'+(viewer?'':'<div class="detailsection"><button class="quiet" type="button" data-a="complete" data-id="'+t.id+'">'+(t.done?'Reopen task':'Complete task')+'</button></div>')+'</aside>'}
function render(){document.querySelector('#view').innerHTML=(st.v==='project'?project():plan(st.v==='search'?'inbox':st.v))+detail();document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('active',x.dataset.v===st.v));document.querySelector('.search').value=st.q;document.querySelector('#crumb').textContent=st.v==='project'?'Website relaunch':st.v.charAt(0).toUpperCase()+st.v.slice(1)}
document.addEventListener('click',e=>{const x=e.target.closest('[data-a],[data-v]');if(!x)return;if(x.dataset.v){st.v=x.dataset.v;st.q='';render();return}const a=x.dataset.a;if(a==='select'){st.sel=Number(x.dataset.id);render()}if(a==='complete'){if(st.role==='Viewer'){toast('Viewers can follow work, but cannot change task status.');return}const t=one(x.dataset.id),old=t.done;t.done=!t.done;toast((t.done?'Completed “':'Reopened “')+t.t+'”.',()=>{t.done=old;render();toast('Change undone.')});render()}if(a==='composer'){if(st.role==='Viewer')toast('Viewers cannot create or edit tasks.');else{st.compose=!st.compose;render();document.querySelector('.composer input')?.focus()}}if(a==='close'){st.sel=null;render()}if(a==='show-completed'){st.completed=true;render()}if(a==='undo'&&st.undo){const u=st.undo;st.undo=null;clearTimeout(st.timer);document.querySelector('.toast').classList.remove('show');u()}if(a==='open-project'){document.querySelector('#overlay').classList.add('open');document.querySelector('#overlay').setAttribute('aria-hidden','false');setTimeout(()=>document.querySelector('[name="project"]').focus(),0)}if(a==='close-project'){document.querySelector('#overlay').classList.remove('open');document.querySelector('#overlay').setAttribute('aria-hidden','true')}if(a==='members')toast('3 active members: Avery (Owner), Maya (Editor), and Jon (Viewer).');if(a==='swap-role'){st.role=st.role==='Owner'?'Viewer':'Owner';document.querySelector('#role').textContent=st.role+' · Workspace';toast('Prototype role: '+st.role+'.');render()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.a==='make-task'){e.preventDefault();const d=new FormData(f),title=String(d.get('title')).trim();if(!title)return;const t={id:Date.now(),s:'Launch plan',t:title,d:'',p:d.get('priority'),tag:'General',who:'Avery',av:'A',due:d.get('due'),late:false,subs:[],comments:[],done:false};tasks.push(t);st.sel=t.id;st.compose=false;toast('Added “'+title+'” to Website relaunch.');render()}if(f.dataset.a==='comment'){e.preventDefault();const text=String(new FormData(f).get('comment')).trim(),t=one(st.sel);if(!text||!t)return;t.comments.push(['Avery',text,'Just now']);toast('Comment added to the task.');render()}if(f.dataset.a==='make-project'){e.preventDefault();const d=new FormData(f),name=String(d.get('project')).trim();if(!name)return;document.querySelector('#overlay').classList.remove('open');document.querySelector('#overlay').setAttribute('aria-hidden','true');toast('Created “'+name+'”. Invite an '+d.get('invite')+' when you are ready.')}});
document.addEventListener('input',e=>{if(e.target.matches('[data-a="search"]')){st.q=e.target.value;st.v=st.v==='project'?'project':'search';render()}});
render();
</script>
</body>
</html>
